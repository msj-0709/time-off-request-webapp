name: Deploy to Google Apps Script

# main 브랜치에 코드가 올라오면 Apps Script 에 자동 반영 + 기존 웹앱 배포를 새 버전으로 갱신
on:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "*.html"
      - "appsscript.json"
      - ".clasp.json"
      - ".github/workflows/deploy-apps-script.yml"
  workflow_dispatch: {}

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 갱신할 배포 ID 목록 (공백 구분). 배포를 갱신하므로 URL 이 바뀌지 않습니다.
      # - AKfycbzVg3ko… : 웹앱 주소 (메일 승인 링크, CONFIG.WEB_APP_URL)
      # - AKfycbxO1ngx… : 구글 앱 런처 "연차 신청" 아이콘
      DEPLOYMENT_IDS: ${{ vars.DEPLOYMENT_IDS || 'AKfycbzVg3ko1cP9ruzNhKiexTwrmqmEzkGG1myQRiz4X2h4-tmKlIPj1WEA-PE5wHfS4935EQ AKfycbxO1ngxRLytkNK587dyOyMyW6VjHP_U3IFLF20zIb6_jd1FtXxu9Yqo5_XEzIZ8H48k3g' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::GitHub 저장소 Secrets 에 CLASPRC_JSON 이 없습니다. README 의 '자동 배포 설정'을 참고하세요."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          # 비밀값 형식 점검 (값은 출력하지 않음)
          python3 - <<'PY'
          import json, os, sys
          p = os.path.expanduser("~/.clasprc.json")
          raw = open(p, encoding="utf-8").read()
          def fail(msg):
              print(f"::error::CLASPRC_JSON 형식 오류: {msg} (길이 {len(raw)}자, 첫 글자 {raw[:1]!r}). 받은 파일 내용 전체를 그대로 다시 등록해 주세요.")
              sys.exit(1)
          try:
              d = json.loads(raw)
          except Exception as e:
              fail(f"JSON 이 아님 - {type(e).__name__}. 일부만 복사됐거나 따옴표가 바뀌었을 수 있음")
          if not isinstance(d, dict): fail("JSON 객체가 아님")
          # clasp 3.x 로그인 파일 형식({"tokens": {"default": {...}}}) 이면 clasp 2.4.2 형식으로 변환
          if "token" not in d and isinstance(d.get("tokens"), dict) and d["tokens"]:
              t = d["tokens"].get("default") or next(iter(d["tokens"].values()))
              if not t.get("refresh_token") or not t.get("client_id"):
                  fail("clasp 3 형식이지만 refresh_token/client_id 가 없음")
              d = {
                  "token": {"refresh_token": t["refresh_token"], "token_type": "Bearer"},
                  "oauth2ClientSettings": {"clientId": t["client_id"], "clientSecret": t.get("client_secret", ""), "redirectUri": "http://localhost"},
                  "isLocalCreds": False,
              }
              open(p, "w", encoding="utf-8").write(json.dumps(d))
              print("clasp 3 형식 로그인 파일을 clasp 2.4.2 형식으로 변환했습니다")
          if "token" not in d: fail(f"'token' 항목 없음 (있는 항목: {sorted(d.keys())})")
          if not d["token"].get("refresh_token"): fail("'token.refresh_token' 없음")
          if not d.get("oauth2ClientSettings", {}).get("clientId"): fail("'oauth2ClientSettings.clientId' 없음")
          print("CLASPRC_JSON 형식 정상")
          PY

      - name: Push code to Apps Script
        run: clasp push --force

      - name: Create version and update deployments
        run: |
          DESC="GitHub ${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%MZ)"
          OUT=$(clasp version "$DESC")
          echo "$OUT"
          V=$(echo "$OUT" | grep -o 'version [0-9]*' | grep -o '[0-9]*')
          if [ -z "$V" ]; then echo "::error::버전 생성 실패"; exit 1; fi
          for ID in $DEPLOYMENT_IDS; do
            clasp deploy --deploymentId "$ID" --versionNumber "$V" --description "$DESC"
          done
          clasp deployments | grep -E "$(echo $DEPLOYMENT_IDS | tr ' ' '|')"
