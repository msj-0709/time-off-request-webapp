<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f4f6f8; --card: #fff; --text: #1f2933; --muted: #6b7785; --line: #e3e7eb;
      --primary: #1a73e8; --primary-weak: #e8f0fe;
      --ok: #1e8e3e; --ok-weak: #e6f4ea; --bad: #d93025; --bad-weak: #fce8e6;
      --wait: #b06000; --wait-weak: #fef7e0; --gray-weak: #f1f3f4;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      font-size: 16px; line-height: 1.45; }
    header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 18px; margin: 0; }
    header .who { font-size: 13px; color: var(--muted); text-align: right; }
    main { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(96px + var(--safe-b)); }
    .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    .card h2 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
    label:first-child { margin-top: 0; }
    input, select, textarea { width: 100%; font-size: 16px; /* iOS 확대 방지 */
      padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--text);
      -webkit-appearance: none; appearance: none; min-height: 48px; font-family: inherit; }
    select { background-image: linear-gradient(45deg, transparent 50%, #888 50%), linear-gradient(135deg, #888 50%, transparent 50%);
      background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
    textarea { min-height: 80px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { flex: 1 1 auto; text-align: center; padding: 12px 10px; border: 1px solid var(--line); border-radius: 10px;
      background: #fff; font-size: 15px; cursor: pointer; user-select: none; min-height: 48px; }
    .chip.on { border-color: var(--primary); background: var(--primary-weak); color: var(--primary); font-weight: 600; }
    .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700;
      background: var(--primary); color: #fff; cursor: pointer; min-height: 50px; font-family: inherit; }
    .btn:disabled { opacity: .5; }
    .btn.ghost { background: var(--gray-weak); color: var(--text); }
    .btn.ok { background: var(--ok); } .btn.bad { background: var(--bad); }
    .btn.sm { display: inline-block; width: auto; padding: 8px 14px; min-height: 38px; font-size: 14px; }
    .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .estimate { margin-top: 14px; padding: 12px; border-radius: 10px; background: var(--primary-weak); color: var(--primary); font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .stat b { display: block; font-size: 24px; } .stat span { font-size: 12px; color: var(--muted); }
    .stat.main b { color: var(--primary); }
    .item { padding: 12px 0; border-top: 1px solid var(--line); }
    .item:first-of-type { border-top: 0; padding-top: 0; }
    .item .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .item .dates { font-weight: 700; }
    .item .meta { font-size: 13px; color: var(--muted); margin-top: 2px; word-break: break-all; }
    .item .actions { display: flex; gap: 8px; margin-top: 10px; }
    .item .actions .btn { flex: 1; }
    .badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .s-PENDING { background: var(--wait-weak); color: var(--wait); }
    .s-APPROVED { background: var(--ok-weak); color: var(--ok); }
    .s-DENIED { background: var(--bad-weak); color: var(--bad); }
    .s-CANCELLED { background: var(--gray-weak); color: var(--muted); }
    .month { font-size: 13px; font-weight: 700; color: var(--muted); margin: 18px 0 8px; }
    .month:first-child { margin-top: 0; }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; font-size: 14px; }
    nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line);
      display: flex; padding-bottom: var(--safe-b); }
    nav button { flex: 1; border: 0; background: none; padding: 10px 0 8px; font-size: 12px; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; position: relative; font-family: inherit; }
    nav button .ic { font-size: 21px; line-height: 1; }
    nav button.on { color: var(--primary); font-weight: 700; }
    nav .dot { position: absolute; top: 6px; left: 50%; margin-left: 8px; background: var(--bad); color: #fff;
      font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; line-height: 18px; }
    .toast { position: fixed; left: 50%; bottom: calc(84px + var(--safe-b)); transform: translateX(-50%); z-index: 20;
      background: #323232; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; max-width: 90%;
      opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .loading { position: fixed; inset: 0; z-index: 30; background: rgba(255,255,255,.7); display: none;
      align-items: center; justify-content: center; }
    .loading.show { display: flex; }
    .spinner { width: 36px; height: 36px; border: 4px solid var(--primary-weak); border-top-color: var(--primary);
      border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .install { font-size: 13px; color: var(--muted); }
    .install summary { cursor: pointer; font-weight: 600; color: var(--text); }
  </style>
</head>
<body>
  <header>
    <h1>🌴 휴가 신청</h1>
    <div class="who" id="who"></div>
  </header>

  <main>
    <!-- 신청 -->
    <section id="tab-new">
      <div class="card" id="balanceCard"></div>
      <form class="card" id="form" autocomplete="off">
        <label for="name">이름</label>
        <input id="name" required placeholder="예: 홍길동">

        <label for="approver">승인자</label>
        <select id="approver" required></select>

        <label>휴가 구분</label>
        <div class="chips" id="typeChips"></div>

        <div id="subWrap">
          <label>연차 구분</label>
          <div class="chips" id="subChips"></div>
        </div>

        <div class="row2">
          <div>
            <label for="start">시작일</label>
            <input type="date" id="start" required>
          </div>
          <div>
            <label for="end">종료일</label>
            <input type="date" id="end" required>
          </div>
        </div>

        <label for="reason">사유 (선택)</label>
        <textarea id="reason" placeholder="필요 시 입력"></textarea>

        <div class="estimate" id="estimate"></div>
        <div style="height:14px"></div>
        <button class="btn" type="submit" id="submitBtn">신청하기</button>
      </form>
    </section>

    <!-- 내 휴가 -->
    <section id="tab-mine" class="hidden">
      <div class="card" id="mineList"></div>
    </section>

    <!-- 승인함 -->
    <section id="tab-inbox" class="hidden">
      <div class="card" id="inboxList"></div>
    </section>

    <!-- 팀 일정 -->
    <section id="tab-team" class="hidden">
      <div class="card" id="teamList"></div>
      <div class="card install">
        <details>
          <summary>📱 휴대폰 홈 화면에 앱처럼 추가하기</summary>
          <p><b>아이폰(Safari)</b>: 하단 공유 버튼(□↑) → "홈 화면에 추가"</p>
          <p><b>안드로이드(Chrome)</b>: 우측 상단 ⋮ → "홈 화면에 추가"</p>
        </details>
      </div>
    </section>
  </main>

  <nav>
    <button data-tab="new" class="on"><span class="ic">✏️</span>신청</button>
    <button data-tab="mine"><span class="ic">📋</span>내 휴가</button>
    <button data-tab="inbox" id="inboxTab"><span class="ic">✅</span>승인함<span class="dot hidden" id="inboxDot"></span></button>
    <button data-tab="team"><span class="ic">📅</span>팀 일정</button>
  </nav>

  <div class="toast" id="toast"></div>
  <div class="loading show" id="loading"><div class="spinner"></div></div>

<script>
  var STATE_LABEL = { PENDING: "승인 대기", APPROVED: "승인", DENIED: "반려", CANCELLED: "취소" };
  var data = null;
  var sel = { type: "연차", sub: "종일 연차" };
  var holidaySet = {};

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 2800); }
  function loading(on) { $("loading").classList.toggle("show", on); }

  function call(fn, args, okMsg) {
    loading(true);
    var runner = google.script.run
      .withSuccessHandler(function (res) { loading(false); if (res) render(res); if (okMsg) toast(okMsg); })
      .withFailureHandler(function (err) { loading(false); toast("⚠️ " + (err && err.message || err)); });
    runner[fn].apply(runner, args || []);
  }

  // ---------- 날짜 ----------
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  function parse(s) { var p = s.split("-"); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
  function iso(d) { return d.toISOString().slice(0, 10); }
  function pretty(s) { if (!s) return ""; var d = parse(s);
    return (d.getUTCMonth() + 1) + "/" + d.getUTCDate() + "(" + DOW[d.getUTCDay()] + ")"; }
  function range(a, b) { return a === b ? pretty(a) : pretty(a) + " ~ " + pretty(b); }
  function workdays(a, b) {
    if (!a || !b || b < a) return 0;
    var n = 0, d = parse(a), last = parse(b);
    while (d <= last) { var w = d.getUTCDay();
      if (w !== 0 && w !== 6 && !holidaySet[iso(d)]) n++;
      d.setUTCDate(d.getUTCDate() + 1); }
    return n;
  }
  function daysText(r) { return r.type === "연차" || r.sub ? (r.days + "일") : ""; }

  // ---------- 렌더 ----------
  function render(res) {
    data = res;
    holidaySet = {}; (res.holidays || []).forEach(function (h) { holidaySet[h] = true; });

    $("who").innerHTML = esc(res.user.name || "") + "<br>" + esc(res.user.email || "로그인 필요");
    if (!$("name").value) $("name").value = res.user.name || "";

    renderBalance();
    renderApprovers();
    renderChips();
    renderMine();
    renderInbox();
    renderTeam();
    updateEstimate();
  }

  function renderBalance() {
    var b = data.balance, c = $("balanceCard");
    if (!b) { c.innerHTML = '<h2>내 연차</h2><div class="hint">연차계산 시트에서 이름을 찾을 수 없어 잔여 연차를 표시할 수 없습니다.</div>'; return; }
    c.innerHTML = '<h2>내 연차</h2><div class="stats">' +
      '<div class="stat main"><b>' + b.remaining + '</b><span>사용 가능</span></div>' +
      '<div class="stat"><b>' + b.used + '</b><span>사용</span></div>' +
      '<div class="stat"><b>' + b.granted + '</b><span>발생</span></div></div>' +
      '<div class="hint">입사일 ' + esc(b.joinDate) + ' · 근속 ' + esc(b.tenure) +
      (data.pendingDays ? ' · 승인 대기 ' + data.pendingDays + '일' : '') + '</div>';
  }

  function renderApprovers() {
    var s = $("approver"), prev = s.value || localStorageGet("approver");
    s.innerHTML = '<option value="">선택하세요</option>' + data.approvers.map(function (a) {
      return '<option value="' + esc(a.email) + '">' + esc(a.label) + '</option>'; }).join("");
    if (prev && data.approvers.some(function (a) { return a.email === prev; })) s.value = prev;
  }

  function renderChips() {
    $("typeChips").innerHTML = data.leaveTypes.map(function (t) {
      return '<div class="chip' + (t === sel.type ? " on" : "") + '" data-v="' + esc(t) + '">' + esc(t) + '</div>'; }).join("");
    $("subChips").innerHTML = data.subTypes.map(function (t) {
      return '<div class="chip' + (t === sel.sub ? " on" : "") + '" data-v="' + esc(t) + '">' + esc(t) + '</div>'; }).join("");
    $("subWrap").classList.toggle("hidden", sel.type !== "연차");
  }

  function item(r, actions, showName) {
    return '<div class="item"><div class="top"><div class="dates">' + range(r.start, r.end) + '</div>' +
      '<span class="badge s-' + esc(r.state) + '">' + esc(STATE_LABEL[r.state] || r.state || "-") + '</span></div>' +
      '<div class="meta">' + (showName ? '<b>' + esc(r.name) + '</b> · ' : '') + esc(r.type) +
      (r.sub && r.sub !== "해당 없음" ? ' · ' + esc(r.sub) : '') + (daysText(r) ? ' · ' + daysText(r) : '') + '</div>' +
      (r.reason ? '<div class="meta">사유: ' + esc(r.reason) + '</div>' : '') +
      (actions || "") + '</div>';
  }

  function renderMine() {
    var list = data.mine;
    if (!list.length) { $("mineList").innerHTML = '<h2>내 휴가</h2><div class="empty">신청 내역이 없습니다.</div>'; return; }
    $("mineList").innerHTML = '<h2>내 휴가 (' + list.length + ')</h2>' + list.map(function (r) {
      var canCancel = r.id && (r.state === "PENDING" || (r.state === "APPROVED" && r.start > data.today));
      var act = canCancel ? '<div class="actions"><button class="btn ghost sm" data-cancel="' + esc(r.id) + '">신청 취소</button></div>' : '';
      return item(r, act, false);
    }).join("");
  }

  function renderInbox() {
    var list = data.inbox;
    var dot = $("inboxDot");
    dot.textContent = list.length; dot.classList.toggle("hidden", !list.length);
    if (!list.length) { $("inboxList").innerHTML = '<h2>승인함</h2><div class="empty">승인 대기 중인 신청이 없습니다.</div>'; return; }
    $("inboxList").innerHTML = '<h2>승인 대기 (' + list.length + ')</h2>' + list.map(function (r) {
      return item(r, '<div class="meta">신청 ' + esc(r.createdAt) + '</div><div class="actions">' +
        '<button class="btn bad" data-deny="' + esc(r.id) + '">반려</button>' +
        '<button class="btn ok" data-approve="' + esc(r.id) + '">승인</button></div>', true);
    }).join("");
  }

  function renderTeam() {
    var list = data.team;
    if (!list.length) { $("teamList").innerHTML = '<h2>팀 일정</h2><div class="empty">예정된 휴가가 없습니다.</div>'; return; }
    var html = '<h2>팀 일정</h2>', cur = "";
    list.forEach(function (r) {
      var m = r.start.slice(0, 7);
      if (m !== cur) { cur = m; html += '<div class="month">' + m.replace("-", "년 ") + '월</div>'; }
      html += item(r, "", true);
    });
    $("teamList").innerHTML = html;
  }

  function updateEstimate() {
    var s = $("start").value, e = $("end").value, el = $("estimate");
    if (!s || !e) { el.textContent = "기간을 선택하면 사용 일수가 계산됩니다."; return; }
    if (e < s) { el.textContent = "⚠️ 종료일이 시작일보다 빠릅니다."; return; }
    var half = sel.type === "연차" && sel.sub.indexOf("반차") >= 0;
    if (half && s !== e) { el.textContent = "⚠️ 반차는 하루만 신청할 수 있습니다."; return; }
    var n = half ? 0.5 : workdays(s, e);
    var txt = range(s, e) + " · 주말/공휴일 제외 " + n + "일";
    if (sel.type === "연차" && data && data.balance) txt += " (신청 후 잔여 " + (data.balance.remaining - (data.pendingDays || 0) - n) + "일)";
    el.textContent = txt;
  }

  function localStorageGet(k) { try { return localStorage.getItem("vac_" + k) || ""; } catch (e) { return ""; } }
  function localStorageSet(k, v) { try { localStorage.setItem("vac_" + k, v); } catch (e) {} }

  // ---------- 이벤트 ----------
  document.querySelector("nav").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    document.querySelectorAll("nav button").forEach(function (x) { x.classList.toggle("on", x === b); });
    ["new", "mine", "inbox", "team"].forEach(function (t) { $("tab-" + t).classList.toggle("hidden", t !== b.dataset.tab); });
    window.scrollTo(0, 0);
  });

  $("typeChips").addEventListener("click", function (ev) {
    var c = ev.target.closest(".chip"); if (!c) return; sel.type = c.dataset.v; renderChips(); updateEstimate(); });
  $("subChips").addEventListener("click", function (ev) {
    var c = ev.target.closest(".chip"); if (!c) return; sel.sub = c.dataset.v;
    if (sel.sub.indexOf("반차") >= 0 && $("start").value) $("end").value = $("start").value;
    renderChips(); updateEstimate(); });

  $("start").addEventListener("change", function () {
    var s = $("start").value;
    if (s && (!$("end").value || $("end").value < s || (sel.type === "연차" && sel.sub.indexOf("반차") >= 0))) $("end").value = s;
    $("end").min = s; updateEstimate(); });
  $("end").addEventListener("change", updateEstimate);

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var f = { name: $("name").value, approver: $("approver").value, type: sel.type,
      sub: sel.type === "연차" ? sel.sub : "", start: $("start").value, end: $("end").value, reason: $("reason").value };
    if (!f.approver) return toast("승인자를 선택해 주세요.");
    if (!confirm(range(f.start, f.end) + " " + f.type + (f.sub ? "(" + f.sub + ")" : "") + " 신청할까요?")) return;
    localStorageSet("approver", f.approver);
    call("submitRequest", [f], "✅ 신청되었습니다. 승인자에게 메일이 발송되었습니다.");
    $("start").value = ""; $("end").value = ""; $("reason").value = "";
  });

  document.addEventListener("click", function (ev) {
    var t = ev.target;
    if (t.dataset.approve && confirm("승인할까요?")) call("approveRequest", [t.dataset.approve], "승인되었습니다.");
    if (t.dataset.deny && confirm("반려할까요?")) call("denyRequest", [t.dataset.deny], "반려되었습니다.");
    if (t.dataset.cancel && confirm("이 신청을 취소할까요?")) call("cancelRequest", [t.dataset.cancel], "취소되었습니다.");
  });

  call("getBootstrap");
</script>
</body>
</html>
